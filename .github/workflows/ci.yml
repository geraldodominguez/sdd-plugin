name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Utilitários e hooks
        run: tests/rodar-testes.sh
      - name: Simulação do ciclo de vida
        run: tests/simular-ciclo.sh

  prosa:
    name: Prosa sem travessões
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/sem-travessoes.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x -S warning bin/* scripts/*.sh lib/*.sh tests/*.sh

  validacao:
    name: Validação do plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar o Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate
        run: claude plugin validate .
