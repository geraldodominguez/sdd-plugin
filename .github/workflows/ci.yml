name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Versão do bash
        run: bash --version | head -1
      # Cada falha vira uma anotação no resumo do job, legível sem abrir o log.
      - name: Utilitários e hooks
        run: |
          set +e -o pipefail
          tests/rodar-testes.sh 2>&1 | tee "$RUNNER_TEMP/testes.log"
          r=$?
          if [ "$r" -ne 0 ]; then
            grep -a '✗' "$RUNNER_TEMP/testes.log" | perl -pe 's/\e\[[0-9;]*m//g; s/^ *✗ */::error title=Teste falhou::/' | head -40 || true
            tail -n 15 "$RUNNER_TEMP/testes.log" | perl -pe 's/\e\[[0-9;]*m//g; s/^/::error title=Fim da saída::/' || true
          fi
          exit $r
      - name: Simulação do ciclo de vida
        run: |
          set +e -o pipefail
          tests/simular-ciclo.sh 2>&1 | tee "$RUNNER_TEMP/ciclo.log"
          r=$?
          if [ "$r" -ne 0 ]; then
            tail -n 25 "$RUNNER_TEMP/ciclo.log" | perl -pe 's/\e\[[0-9;]*m//g; s/^/::error title=Simulação::/' || true
          fi
          exit $r
      # O bash do PATH no runner do macOS é o do Homebrew (5.x). O que o usuário
      # tem é o /bin/bash 3.2: os utilitários rodam com ele aqui.
      - name: Utilitários com o bash 3.2 do macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32" && ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          export PATH="$RUNNER_TEMP/bash32:$PATH"
          bash --version | head -1
          set +e -o pipefail
          /bin/bash tests/rodar-testes.sh 2>&1 | tee "$RUNNER_TEMP/testes32.log"
          r=$?
          if [ "$r" -ne 0 ]; then
            grep -a '✗' "$RUNNER_TEMP/testes32.log" | perl -pe 's/\e\[[0-9;]*m//g; s/^ *✗ */::error title=Teste falhou no bash 3.2::/' | head -40 || true
            tail -n 15 "$RUNNER_TEMP/testes32.log" | perl -pe 's/\e\[[0-9;]*m//g; s/^/::error title=Fim da saída (bash 3.2)::/' || true
          fi
          exit $r

  prosa:
    name: Prosa sem travessões
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/sem-travessoes.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x -S warning bin/* scripts/*.sh lib/*.sh tests/*.sh

  validacao:
    name: Validação do plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar o Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate
        run: claude plugin validate .
