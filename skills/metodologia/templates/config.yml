# Configuração do SDD neste projeto.
# Formato: uma chave por linha ("chave: valor"). Comentários começam com #.

# Nível de rigor sugerido para novas features: 1 (leve) ou 2 (completo).
# O nível 0 (direto) não abre feature. Ver docs/referencia/niveis-de-rigor.md.
nivel_padrao: 1

# Quanto os hooks impõem o fluxo (ver docs/referencia/protecao-por-hooks.md):
#   desligada  hooks inativos, só orientação
#   leve       testes congelados nas fases green, seguranca e auditoria; históricos
#              e estado só pelos utilitários; artefato novo só no lugar do padrão;
#              commits em Conventional Commits, com a tarefa nas fases red a
#              auditoria; Git Flow (nomes de branch, nada em main, a branch da
#              feature ativa)
#   estrita    leve, mais: só artefatos até as tarefas (contratos no plano), só
#              testes e contratos na fase red, contratos congelados na green, e
#              nada de código nas fases seguranca e auditoria
protecao: leve

# Git Flow (ver docs/referencia/git-flow.md no plugin). Os nomes das branches
# são fixos, iguais em todo projeto: main (produção), develop (integração),
# feature/NNN-slug, release/X.Y.Z, hotfix/X.Y.Z, e as tags vX.Y.Z em main.
#   ativo      o plugin cria as branches, confere os commits e o CI confere os PRs
#   desligado  o plugin não cria nem confere branches
gitflow: ativo

# Como uma branch entra em outra no Git Flow:
#   local  o sdd-gitflow faz o merge --no-ff (e a tag) e você publica com git push
#   pr     o agente abre o pull request (gh) e o merge acontece na plataforma
integracao: local

# Mensagens de commit (ver docs/referencia/versionamento.md no plugin):
#   convencional  Conventional Commits, "tipo(NNN): descrição" (feat, fix, docs,
#                 chore, refactor, test, perf, build, ci, style, revert); é dela
#                 que saem a próxima versão SemVer e o CHANGELOG.md
#   livre         o hook não confere o formato
commits: convencional

# Pastas, relativas à raiz do projeto.
pasta_specs: specs             # uma pasta por feature: o que cada mudança alterou
pasta_sistema: sistema         # spec viva do sistema, por capacidade: o que ele faz hoje
pasta_releases: releases       # uma pasta por release
pasta_incidentes: incidentes   # um arquivo por incidente

# Globs, separados por vírgula, que identificam arquivos de teste.
# Ajuste para a convenção do seu projeto.
globs_de_teste: tests/**,test/**,__tests__/**,spec/**,**/*.test.*,**/*.spec.*,**/*_test.*,**/test_*.py,**/*Test.java,**/*Tests.cs

# Globs de contratos em código (tipos, interfaces, schemas, migrations) que o
# arquiteto-de-contratos pode materializar nas fases plano e red, na proteção
# estrita. Vazio mantém os contratos apenas em specs/NNN/contratos/.
globs_de_contrato:

# Áreas sensíveis: globs (separados por vírgula) de código cuja alteração torna
# a revisão de segurança obrigatória, mesmo no nível 1. Ex.:
# src/auth/**,src/pagamentos/**,**/*crypto*,db/migrations/**
areas_sensiveis:

# Exceções de layout: globs (separados por vírgula) de arquivos que parecem
# artefato de processo (spec, plano, tarefas, ADR, backlog, arquitetura) pelo
# nome ou pela pasta, mas não são do SDD e devem ficar onde estão. Sem isso, o
# hook bloqueia criar arquivos assim e o sdd-verificar os aponta. Ex.:
# docs/manual/**,site/content/**
excecoes_de_layout:

# Comandos do projeto. Ficam vazios até você preencher; o /sdd:iniciar e o
# /sdd:pipeline sugerem os valores a partir do código.
comando_teste:                 # suíte de testes (escritor-de-testes, auditor, pipeline)
comando_lint:                  # lint e checagem de tipos
comando_seguranca:             # varreduras: dependências, segredos, análise estática
comando_teste_sistema:         # ponta a ponta e carga (testador-de-sistema)
comando_deploy_homologacao:    # implanta no ambiente de homologação
comando_deploy_producao:       # implanta em produção (só depois do go/no-go)
comando_verificacao_producao:  # verificação pós-implantação (health check, smoke)
